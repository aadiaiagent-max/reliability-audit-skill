name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run findings validator tests
        run: node skills/reliability-audit/validate-findings.test.cjs
      - name: Run coverage-ledger validator tests
        run: node skills/reliability-audit/validate-coverage-ledger.test.cjs
